version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fraud-engine-postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      POSTGRES_DB: fraud_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-engine-backend
    environment:
      DATABASE_URL: postgresql://fraud_user:fraud_password@db:5432/fraud_engine
      NOTIFIER: log
      FLAG_THRESHOLD: 50
      HIGH_RISK_THRESHOLD: 80
      AWS_REGION: us-east-1
      CONSOLE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-engine-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
